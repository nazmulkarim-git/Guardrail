<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Forsig</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="contact">
    <main class="contact-page">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span>Forsig</span>
      </a>
      <section class="contact-card reveal">
        <span class="eyebrow">Contact founder</span>
        <h1>Send a message about Forsig.</h1>
        <p>I read each email personally and reply personally. Share what you are building, what risk you are trying to control, or how Forsig can help.</p>
        <form id="contact-form" class="contact-form">
          <input name="name" type="text" required placeholder="Name *" autocomplete="name" />
          <input name="email" type="email" required placeholder="Email *" autocomplete="email" />
          <input name="company" type="text" placeholder="Company" autocomplete="organization" />
          <select name="role">
            <option value="">Role (optional)</option>
            <option>Founder</option>
            <option>CEO</option>
            <option>CTO</option>
            <option>CFO</option>
            <option>Developer</option>
            <option>Product Manager</option>
          </select>
          <textarea name="message" required placeholder="Write your message *"></textarea>
          <button class="button primary" type="submit">Send message</button>
          <p id="contact-status" class="mini-status" role="status"></p>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
