<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Forsig</title>
    <meta name="description" content="Contact Forsig about human intervention workflows for AI agents." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.forsig.com/contact" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="contact" class="helicone-surface">
    <main class="contact-page">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span>Forsig</span>
      </a>
      <section class="contact-card reveal">
        <span class="eyebrow">Contact</span>
        <h1>Send a message.</h1>
        <p>Share what you are building and where your agents need human review.</p>
        <form id="contact-form" class="contact-form">
          <input name="name" type="text" required placeholder="Name *" autocomplete="name" />
          <input name="email" type="email" required placeholder="Email *" autocomplete="email" />
          <input name="company" type="text" placeholder="Company" autocomplete="organization" />
          <select name="role">
            <option value="">Role (optional)</option>
            <option>Founder</option>
            <option>CEO</option>
            <option>CTO</option>
            <option>CFO</option>
            <option>Developer</option>
            <option>Product Manager</option>
          </select>
          <textarea name="message" required placeholder="Write your message *"></textarea>
          <button class="button primary" type="submit">Send message</button>
          <p id="contact-status" class="mini-status" role="status"></p>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
